name: Obtener Números Spam

on:
  schedule:
    - cron: '0 16 * * *'  # 16:00 UTC
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install httpx tls_client typing-extensions
  
    - name: Set up WARP
      uses: viperadnan-git/setup-warp@v1
      with:
        mode: client
        stack: dual
        retries: 3

    - name: Run Spanish phone scraper
      env:
        PROXY: ${{ secrets.PROXY }}
        OPENSPAM_API_KEY: ${{ secrets.OPENSPAM_API_KEY }}
      run: |
        python src/scraper.py

    - name: Upload numbers as artifact
      uses: actions/upload-artifact@v6
      with:
        name: phone-numbers
        path: lista_numeros_spam.txt
        
    - name: Commit and push results
      run: |
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --global user.name "github-actions[bot]"
        git add lista_numeros_spam.txt
        git diff-index --quiet HEAD || (git commit -m "Update phone numbers [skip ci]" && git push)
